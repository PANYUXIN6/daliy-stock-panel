name: CI and Preproduction Deploy

# 持续集成: 后端全量测试 + 前端构建；main 检查成功后部署预发。
# 与 release.yml 的分工: 这里不打包, 只守质量门 —
# 后端含 Tier A 开放契约快照测试 (test_openapi_contract.py),
# 开放面的任何变化都会在这里被拦下, 须有意识地更新快照。
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  # main 发布不能被后续提交中途取消；develop/PR 仍可取消过时检查。
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: 设置 Python
        run: uv python install 3.12

      - name: 安装依赖 (含 dev 测试链)
        run: uv sync --extra dev --frozen

      - name: 后端全量测试
        run: uv run pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 设置 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 (tsc + vite)
        run: pnpm build

  deploy:
    name: Deploy Preproduction
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: preproduction
      url: ${{ vars.DEPLOY_URL }}
    concurrency:
      group: deploy-preproduction
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 发布已验证的 main 提交
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/stock-panel' }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: bash scripts/ci_deploy.sh

[project]
name = "tickflow-stock-panel-backend"
version = "0.3.8"
description = "A 股选股 + 监控 + 回测面板 — TickFlow 适配"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.6",
    "sse-starlette>=2.0",
    # Data
    # 1.44 起含流式引擎 executor 线程调度修复; 上限锁定一个已验证的大版本,
    # 升级需重跑 scripts/stress_polars_concurrency.py 压测 (并发死锁回归)。
    "polars>=1.44,<1.45",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    "pandas>=2.2",                # 仅在 BacktestService 边界使用,见 §7.4 / ADR-19
    "psutil>=5.9",                # 独立回测 worker 的峰值 RSS 与退出后内存指标
    # llvmlite 不再提供 macOS Intel wheel；该平台使用 Matrix 纯 Python fallback。
    "numba>=0.65.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "fastexcel>=0.10",            # Polars 读取 xlsx/xls
    "pypinyin>=0.50",             # 股票名拼音首字母搜索 (同花顺式 payh → 平安银行)
    # TickFlow 官方 SDK
    "tickflow[all]>=0.1.23",
    # Scheduling
    "apscheduler>=3.10",
    # Config
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # AI(可选,但默认装上)
    "openai>=1.40",               # OpenAI 兼容适配器复用 openai SDK
    "httpx>=0.27",
    # Watchlist screenshot OCR (Tesseract)
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
]

[project.optional-dependencies]
# Legacy CPU runtime: install the Polars compatibility kernel on
# machines without AVX2/FMA support.
# Enable with: uv sync --extra legacy-cpu
legacy-cpu = [
    "polars[rtcompat]>=1.44,<1.45",
]

# vectorbt 还会引入绘图、交互组件等完整分析栈，仍保持为可选 extras。
# Matrix 引擎只直接依赖上面的 numba/llvmlite 编译内核。
# 启用:`uv sync --extra backtest`
backtest = [
    "vectorbt>=0.26",
]

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# BLE 检查宽泛异常捕获；有意保留的降级分支用局部 noqa: BLE001 标明。
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "BLE"]
ignore = [
    "E501",    # 长行交给 fmt
    # 中文注释与字符串正常使用全角标点。
    "RUF001",  # String contains ambiguous unicode character
    "RUF002",  # Docstring contains ambiguous unicode character
    "RUF003",  # Comment contains ambiguous unicode character
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

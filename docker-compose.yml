x-service: &service
  build:
    context: .
    dockerfile: Dockerfile
    args:
      BACKEND_EXTRAS: ${BACKEND_EXTRAS:-}
  env_file:
    - .env
  volumes:
    - ./data:/app/data
    - ./tiers.yaml:/app/tiers.yaml:ro
    - ./.env:/app/.env:ro
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3018/health', timeout=3)"]
    interval: 30s
    timeout: 5s
    start_period: 120s
    retries: 3

services:
  web:
    <<: *service
    ports:
      - "${HOST:-0.0.0.0}:${PORT:-3018}:3018"
    environment:
      DATA_DIR: /app/data
      SERVICE_ROLE: web
      COLLECTOR_URL: http://collector:3018
    depends_on:
      collector:
        condition: service_started

  collector:
    <<: *service
    # 只在 Compose 网络内可达，不映射宿主机端口。
    command: ["uv", "run", "--no-sync", "uvicorn", "app.collector:app", "--no-proxy-headers", "--host", "0.0.0.0", "--port", "3018"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATA_DIR: /app/data
      SERVICE_ROLE: collector
